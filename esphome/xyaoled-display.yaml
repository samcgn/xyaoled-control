# ESP32 bridge for one XYAO-LED panel -> Home Assistant (native ESPHome API).
# Copy this file, set the substitutions, add wifi_ssid / wifi_password to your secrets.yaml, flash.
substitutions:
  name: xyaoled-display          # one ESP32 per panel location, e.g. xyao-main-hall
  friendly_name: XyaoLED Display
  panel_mac: "24:63:A5:00:00:00" # the panel's BLE address (it advertises as XyaoLED_xxxx)
  panel_width: "32"              # 32 for 32x16 panels, 64 for 64x16 panels

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  actions:
    # esphome.<name>_display_text from HA automations/scripts
    - action: display_text
      variables:
        message: string
        red: int
        green: int
        blue: int
        mode: int    # 0 auto (scroll when wider than the panel), 1 static, 2 scroll
        speed: int   # 0 = default; higher = slower
        font: string    # mono, sans, bold, italic, narrow, large, tall, slim, small ("" = default)
        effect: string  # none, flash (flash applies to text that fits without scrolling)
      then:
        - lambda: 'id(panel).display_text(message, red, green, blue, mode, speed, font, effect);'
    # esphome.<name>_send_raw: raw command frames in hex, '|' separated (see PROTOCOL.md)
    - action: send_raw
      variables:
        frames: string
      then:
        - lambda: 'id(panel).send_frames_hex(frames);'

ota:
  - platform: esphome

external_components:
  - source:
      type: git
      url: https://github.com/dreyfussflip/xyaoled-control
      path: esphome/components
    components: [xyao_led]

esp32_ble:
  max_connections: 3

esp32_ble_tracker:

ble_client:
  - mac_address: ${panel_mac}
    id: panel_ble

xyao_led:
  - id: panel
    ble_client_id: panel_ble
    width: ${panel_width}
    # init_frame: "99aa002eff88..."   # only if your panel ignores the bundled handshake

select:
  - platform: template
    name: "Colour"
    id: panel_colour
    optimistic: true
    restore_value: true
    options: [Red, Green, Blue, Yellow, White, Cyan, Magenta, Orange]
    initial_option: Red

  - platform: template
    name: "Font"
    id: panel_font
    optimistic: true
    restore_value: true
    options: [mono, sans, bold, italic, narrow, large, tall, slim, small]
    initial_option: mono

  - platform: template
    name: "Effect"
    id: panel_effect
    optimistic: true
    restore_value: true
    options: [none, flash]
    initial_option: none

text:
  - platform: template
    name: "Message"
    mode: text
    max_length: 200
    optimistic: true
    set_action:
      - lambda: |-
          std::string c = id(panel_colour).current_option();
          uint8_t r = 255, g = 0, b = 0;
          if (c == "Green") { r = 0; g = 255; b = 0; }
          else if (c == "Blue") { r = 0; g = 0; b = 255; }
          else if (c == "Yellow") { r = 255; g = 200; b = 0; }
          else if (c == "White") { r = 255; g = 255; b = 255; }
          else if (c == "Cyan") { r = 0; g = 255; b = 255; }
          else if (c == "Magenta") { r = 255; g = 0; b = 255; }
          else if (c == "Orange") { r = 255; g = 100; b = 0; }
          id(panel).display_text(x, r, g, b, 0, 0, id(panel_font).current_option(), id(panel_effect).current_option());

number:
  - platform: template
    name: "Brightness"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 80
    set_action:
      - lambda: 'id(panel).set_brightness((int) x);'

button:
  - platform: template
    name: "Clear"
    on_press:
      - lambda: 'id(panel).clear();'

switch:
  - platform: template
    name: "Power"
    lambda: 'return id(panel).has_state() ? optional<bool>(id(panel).is_on()) : optional<bool>{};'
    turn_on_action:
      - lambda: 'id(panel).set_power(true);'
    turn_off_action:
      - lambda: 'id(panel).set_power(false);'
