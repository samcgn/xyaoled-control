# One ESP32 driving three panels: one XYAO-LED (XyaoLED_xxxx) and two iPixel Color (LED_BLE_xxxxxxxx) boards.
# Set the three MAC addresses, add wifi_ssid / wifi_password to secrets.yaml, flash.
# HA actions: esphome.<name>_display_text (panel 1), _panel2_display_text, _panel3_display_text.
substitutions:
  name: xyaoled-multi
  friendly_name: XyaoLED Panels
  panel_mac: "24:63:A5:3A:E8:6F"     # XYAO-LED panel
  panel2_mac: "68:E4:C3:8B:0C:97"    # iPixel Color panel
  panel3_mac: "4C:82:63:E6:DF:B1"    # iPixel Color panel
  panel_width: "32"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "XyaoLED Fallback"

captive_portal:

api:
  actions:
    - action: display_text
      variables:
        message: string
        red: int
        green: int
        blue: int
        mode: int
        speed: int
        font: string
        effect: string
      then:
        - lambda: 'id(panel).display_text(message, red, green, blue, mode, speed, font, effect);'
    - action: panel2_display_text
      variables:
        message: string
        red: int
        green: int
        blue: int
        mode: int
        speed: int
        font: string
        effect: string
      then:
        - lambda: 'id(panel2).display_text(message, red, green, blue, mode, speed, font, effect);'
    - action: panel3_display_text
      variables:
        message: string
        red: int
        green: int
        blue: int
        mode: int
        speed: int
        font: string
        effect: string
      then:
        - lambda: 'id(panel3).display_text(message, red, green, blue, mode, speed, font, effect);'
    - action: send_raw
      variables:
        frames: string
      then:
        - lambda: 'id(panel).send_frames_hex(frames);'

ota:
  - platform: esphome

external_components:
  - source:
      type: git
      url: https://github.com/dreyfussflip/xyaoled-control
      ref: styles
      path: esphome/components
    refresh: 0s
    components: [xyao_led]

esp32_ble:
  max_connections: 3

esp32_ble_tracker:

ble_client:
  - mac_address: ${panel_mac}
    id: panel_ble
  - mac_address: ${panel2_mac}
    id: panel2_ble
  - mac_address: ${panel3_mac}
    id: panel3_ble

xyao_led:
  - id: panel
    ble_client_id: panel_ble
    width: ${panel_width}
  - id: panel2
    ble_client_id: panel2_ble
    protocol: ipixel
  - id: panel3
    ble_client_id: panel3_ble
    protocol: ipixel

select:
  - platform: template
    name: "Colour"
    id: panel_colour
    optimistic: true
    restore_value: true
    options: [Red, Green, Blue, Yellow, White, Cyan, Magenta, Orange]
    initial_option: Red
  - platform: template
    name: "Font"
    id: panel_font
    optimistic: true
    restore_value: true
    options: [mono, sans, bold, italic, narrow, large, tall, slim, small]
    initial_option: mono
  - platform: template
    name: "Effect"
    id: panel_effect
    optimistic: true
    restore_value: true
    options: [none, flash]
    initial_option: none

text:
  - platform: template
    name: "Message"
    mode: text
    max_length: 200
    optimistic: true
    set_action:
      - lambda: |-
          std::string c = id(panel_colour).current_option();
          uint8_t r = 255, g = 0, b = 0;
          if (c == "Green") { r = 0; g = 255; b = 0; }
          else if (c == "Blue") { r = 0; g = 0; b = 255; }
          else if (c == "Yellow") { r = 255; g = 200; b = 0; }
          else if (c == "White") { r = 255; g = 255; b = 255; }
          else if (c == "Cyan") { r = 0; g = 255; b = 255; }
          else if (c == "Magenta") { r = 255; g = 0; b = 255; }
          else if (c == "Orange") { r = 255; g = 100; b = 0; }
          id(panel).display_text(x, r, g, b, 0, 0, id(panel_font).current_option(), id(panel_effect).current_option());

number:
  - platform: template
    name: "Brightness"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 80
    set_action:
      - lambda: 'id(panel).set_brightness((int) x);'

button:
  - platform: template
    name: "Clear"
    on_press:
      - lambda: 'id(panel).clear();'

switch:
  - platform: template
    name: "Power"
    lambda: 'return id(panel).has_state() ? optional<bool>(id(panel).is_on()) : optional<bool>{};'
    turn_on_action:
      - lambda: 'id(panel).set_power(true);'
    turn_off_action:
      - lambda: 'id(panel).set_power(false);'
